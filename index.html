<meta charset="utf-8" />
<script>
(function () {
  var key = "ceibs-russia-lang";
  var stored;
  try { stored = localStorage.getItem(key); } catch (e) { return; }
  if (!stored) {
    var list = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    var nav = String(list).toLowerCase();
    var detected = nav.indexOf("zh") === 0 ? "zh" : nav.indexOf("ru") === 0 ? "ru" : "en";
    try { localStorage.setItem(key, detected); } catch (e) {}
    if (detected === "zh") location.replace("zh.html");
    else if (detected === "ru") location.replace("ru.html");
  } else if (stored === "zh") location.replace("zh.html");
  else if (stored === "ru") location.replace("ru.html");
})();
</script>
